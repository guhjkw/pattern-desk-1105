<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern Desk · working demo</title>
<meta name="description" content="Working demo of a multi-account pattern trading system: double top and double bottom strategies for day and swing trading, a 15-day backtest, TradingView alerts, and one signal routed to Zerodha, Angel One and Interactive Brokers with sizing and risk checks.">
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}
:root{
  --bg:#0d1117;--panel:#151b23;--panel2:#1b222c;--line:#283241;--line2:#1f2732;--text:#e6edf3;--muted:#93a1b0;--faint:#66737f;
  --acc:#4ea1ff;--acc2:#2f7fd8;--long:#2fb67c;--short:#e25c5c;--warn:#e3a33b;--ok:#2fb67c;--err:#e25c5c;
  --gold:#f0c45c;--goldbg:#2a2412;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html,body{margin:0}
body{font:14px/1.5 var(--sans);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.r{text-align:right}
td,th{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pd-strip{background:#0a0d12;border-bottom:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:7px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pd-strip b{color:var(--text)}
.pd-strip .sp{flex:1}
.pd-btn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:550}
.pd-btn:hover{border-color:#3a4658}
.pd-btn.pri{background:var(--acc2);border-color:var(--acc2);color:#fff}
.pd-btn.sm{padding:3px 9px;font-size:12.5px}
.pd-btn.gold{border-color:#6b5520;color:var(--gold)}
.pd-btn.danger{border-color:#6a2b2b;color:#ff8b8b}
.pd-btn.on{background:#3a1717;border-color:#a23a3a;color:#ffb3b3}
.pd-top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.pd-brand{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;gap:8px;align-items:center}
.pd-logo{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#2f7fd8,#2fb67c);display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.pd-top .sp{flex:1}
.pd-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;border-radius:10px;padding:1px 8px;white-space:nowrap;border:1px solid transparent}
.pd-chip.paper{background:#1b2a3d;color:#9ccaff;border-color:#2b4566}
.pd-chip.ok{background:#12301f;color:#7fe0b0}.pd-chip.err{background:#3a1717;color:#ff9c9c}.pd-chip.warn{background:#33260f;color:#f1c27a}.pd-chip.grey{background:#20262f;color:var(--muted)}
.pd-chip.long{background:#12301f;color:#7fe0b0}.pd-chip.short{background:#3a1717;color:#ff9c9c}
.pd-tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.pd-tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.pd-tabs button.on{color:var(--text);border-bottom-color:var(--acc)}
.pd-view{padding:18px 20px 44px;max-width:1320px;margin:0 auto}
.pd-view h1{font-size:20px;margin:0 0 4px}
.pd-view .lead{color:var(--muted);margin:0 0 14px;max-width:900px}
h4.pd-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px;font-weight:700}
.pd-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.pd-grid{display:grid;gap:12px}
.pd-g2{grid-template-columns:repeat(2,minmax(0,1fr))}.pd-g3{grid-template-columns:repeat(3,minmax(0,1fr))}.pd-g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.pd-side{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:14px;align-items:start}
.pd-field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px}
.pd-field input,.pd-field select,.pd-field textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel2);font-weight:400;color:var(--text);font-size:13.5px;min-width:0;width:100%}
.pd-field input[type=checkbox]{width:auto}
.pd-field textarea{font-family:var(--mono);font-size:12px}
.pd-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pd-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pd-kpi .lab{font-size:11.5px;color:var(--muted);font-weight:650}
.pd-kpi .val{font-size:22px;font-weight:700;letter-spacing:-.01em}
.pos{color:var(--long);font-weight:650}.neg{color:var(--short);font-weight:650}
.pd-tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.pd-tbl{border-collapse:collapse;width:100%;font-size:13px}
.pd-tbl th{background:var(--panel2);text-align:left;font-weight:650;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.pd-tbl td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.pd-tbl tr:last-child td{border-bottom:0}
.pd-tbl tr.click{cursor:pointer}.pd-tbl tr.click:hover td{background:#1a212b}
.pd-banner{border-radius:8px;padding:10px 14px;margin:0 0 12px}
.pd-banner.ok{background:#102619;border:1px solid #1f4d33;color:#a7ecc6}.pd-banner.err{background:#2a1214;border:1px solid #5c2328;color:#ffb3b3}
.pd-banner.warn{background:#2a200d;border:1px solid #5a4417;color:#f6d28f}.pd-banner.info{background:#111f31;border:1px solid #23405f;color:#b3d4ff}
pre.pd-code{background:#0a0d12;border:1px solid var(--line);color:#d6e2ee;border-radius:8px;padding:12px 14px;overflow:auto;font:12px/1.55 var(--mono);margin:0;max-height:360px;white-space:pre}
svg.pd-chart{width:100%;height:auto;display:block;background:#0b0f15;border:1px solid var(--line);border-radius:8px}
.pd-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 2px}
.pd-legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:4px}
.pd-acct{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.pd-acct h3{margin:0 0 2px;font-size:15px}
.pd-dec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel)}
.pd-dec.take{border-color:#245a3d}.pd-dec.skip{border-color:#4a2a2e}
.pd-dec summary .mono{overflow-wrap:anywhere;word-break:break-all}
.pd-tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pd-tier{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative}
.pd-tier.feat{border:2px solid var(--gold);background:linear-gradient(#1d1a10,var(--panel))}
.pd-tier .tag{position:absolute;top:-11px;left:14px;background:var(--gold);color:#241c06;font-size:11px;font-weight:800;border-radius:10px;padding:2px 10px}
.pd-tier .price{font-size:28px;font-weight:800}
.pd-tier ul{margin:8px 0 0;padding-left:18px;color:#c9d4df}.pd-tier li{margin:3px 0}
.pd-strike{text-decoration:line-through;color:var(--faint)}
.pd-cta{background:#0f2a22;border:1px solid #1f5a47;border-radius:12px;padding:16px 18px}
.pd-scope{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:18px;padding-top:12px}
.pd-toast{position:fixed;right:16px;bottom:16px;background:#22303f;color:#fff;border:1px solid #33465c;border-radius:8px;padding:10px 14px;max-width:420px;z-index:50;font-size:13px}
svg.pd-arch{width:100%;height:auto;display:block}
@media (max-width:980px){.pd-g6{grid-template-columns:repeat(3,minmax(0,1fr))}.pd-g3,.pd-tiers{grid-template-columns:minmax(0,1fr)}.pd-side{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.pd-g2{grid-template-columns:minmax(0,1fr)}.pd-g6{grid-template-columns:repeat(2,minmax(0,1fr))}.pd-view{padding:14px 16px 40px}}
</style>
</head>

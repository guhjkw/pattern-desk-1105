<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern Desk · working demo</title>
<meta name="description" content="Working demo of a multi-account pattern trading system: double top and double bottom strategies for day and swing trading, a 15-day backtest, TradingView alerts, and one signal routed to Zerodha, Angel One and Interactive Brokers with sizing and risk checks.">
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}
:root{
  --bg:#0d1117;--panel:#151b23;--panel2:#1b222c;--line:#283241;--line2:#1f2732;--text:#e6edf3;--muted:#93a1b0;--faint:#66737f;
  --acc:#4ea1ff;--acc2:#2f7fd8;--long:#2fb67c;--short:#e25c5c;--warn:#e3a33b;--ok:#2fb67c;--err:#e25c5c;
  --gold:#f0c45c;--goldbg:#2a2412;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html,body{margin:0}
body{font:14px/1.5 var(--sans);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.r{text-align:right}
td,th{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pd-strip{background:#0a0d12;border-bottom:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:7px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pd-strip b{color:var(--text)}
.pd-strip .sp{flex:1}
.pd-btn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:550}
.pd-btn:hover{border-color:#3a4658}
.pd-btn.pri{background:var(--acc2);border-color:var(--acc2);color:#fff}
.pd-btn.sm{padding:3px 9px;font-size:12.5px}
.pd-btn.gold{border-color:#6b5520;color:var(--gold)}
.pd-btn.danger{border-color:#6a2b2b;color:#ff8b8b}
.pd-btn.on{background:#3a1717;border-color:#a23a3a;color:#ffb3b3}
.pd-top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.pd-brand{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;gap:8px;align-items:center}
.pd-logo{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#2f7fd8,#2fb67c);display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.pd-top .sp{flex:1}
.pd-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;border-radius:10px;padding:1px 8px;white-space:nowrap;border:1px solid transparent}
.pd-chip.paper{background:#1b2a3d;color:#9ccaff;border-color:#2b4566}
.pd-chip.ok{background:#12301f;color:#7fe0b0}.pd-chip.err{background:#3a1717;color:#ff9c9c}.pd-chip.warn{background:#33260f;color:#f1c27a}.pd-chip.grey{background:#20262f;color:var(--muted)}
.pd-chip.long{background:#12301f;color:#7fe0b0}.pd-chip.short{background:#3a1717;color:#ff9c9c}
.pd-tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.pd-tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.pd-tabs button.on{color:var(--text);border-bottom-color:var(--acc)}
.pd-view{padding:18px 20px 44px;max-width:1320px;margin:0 auto}
.pd-view h1{font-size:20px;margin:0 0 4px}
.pd-view .lead{color:var(--muted);margin:0 0 14px;max-width:900px}
h4.pd-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px;font-weight:700}
.pd-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.pd-grid{display:grid;gap:12px}
.pd-g2{grid-template-columns:repeat(2,minmax(0,1fr))}.pd-g3{grid-template-columns:repeat(3,minmax(0,1fr))}.pd-g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.pd-side{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:14px;align-items:start}
.pd-field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px}
.pd-field input,.pd-field select,.pd-field textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel2);font-weight:400;color:var(--text);font-size:13.5px;min-width:0;width:100%}
.pd-field input[type=checkbox]{width:auto}
.pd-field textarea{font-family:var(--mono);font-size:12px}
.pd-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pd-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pd-kpi .lab{font-size:11.5px;color:var(--muted);font-weight:650}
.pd-kpi .val{font-size:22px;font-weight:700;letter-spacing:-.01em}
.pos{color:var(--long);font-weight:650}.neg{color:var(--short);font-weight:650}
.pd-tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.pd-tbl{border-collapse:collapse;width:100%;font-size:13px}
.pd-tbl th{background:var(--panel2);text-align:left;font-weight:650;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.pd-tbl td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.pd-tbl tr:last-child td{border-bottom:0}
.pd-tbl tr.click{cursor:pointer}.pd-tbl tr.click:hover td{background:#1a212b}
.pd-banner{border-radius:8px;padding:10px 14px;margin:0 0 12px}
.pd-banner.ok{background:#102619;border:1px solid #1f4d33;color:#a7ecc6}.pd-banner.err{background:#2a1214;border:1px solid #5c2328;color:#ffb3b3}
.pd-banner.warn{background:#2a200d;border:1px solid #5a4417;color:#f6d28f}.pd-banner.info{background:#111f31;border:1px solid #23405f;color:#b3d4ff}
pre.pd-code{background:#0a0d12;border:1px solid var(--line);color:#d6e2ee;border-radius:8px;padding:12px 14px;overflow:auto;font:12px/1.55 var(--mono);margin:0;max-height:360px;white-space:pre}
svg.pd-chart{width:100%;height:auto;display:block;background:#0b0f15;border:1px solid var(--line);border-radius:8px}
.pd-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 2px}
.pd-legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:4px}
.pd-acct{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.pd-acct h3{margin:0 0 2px;font-size:15px}
.pd-dec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel)}
.pd-dec.take{border-color:#245a3d}.pd-dec.skip{border-color:#4a2a2e}
.pd-dec summary .mono{overflow-wrap:anywhere;word-break:break-all}
.pd-tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pd-tier{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative}
.pd-tier.feat{border:2px solid var(--gold);background:linear-gradient(#1d1a10,var(--panel))}
.pd-tier .tag{position:absolute;top:-11px;left:14px;background:var(--gold);color:#241c06;font-size:11px;font-weight:800;border-radius:10px;padding:2px 10px}
.pd-tier .price{font-size:28px;font-weight:800}
.pd-tier ul{margin:8px 0 0;padding-left:18px;color:#c9d4df}.pd-tier li{margin:3px 0}
.pd-strike{text-decoration:line-through;color:var(--faint)}
.pd-cta{background:#0f2a22;border:1px solid #1f5a47;border-radius:12px;padding:16px 18px}
.pd-scope{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:18px;padding-top:12px}
.pd-toast{position:fixed;right:16px;bottom:16px;background:#22303f;color:#fff;border:1px solid #33465c;border-radius:8px;padding:10px 14px;max-width:420px;z-index:50;font-size:13px}
svg.pd-arch{width:100%;height:auto;display:block}
@media (max-width:980px){.pd-g6{grid-template-columns:repeat(3,minmax(0,1fr))}.pd-g3,.pd-tiers{grid-template-columns:minmax(0,1fr)}.pd-side{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.pd-g2{grid-template-columns:minmax(0,1fr)}.pd-g6{grid-template-columns:repeat(2,minmax(0,1fr))}.pd-view{padding:14px 16px 40px}}
</style>
</head>
<body>
<div class="pd-strip"><span><b>Working demo.</b> Synthetic prices and paper orders: nothing here connects to a real broker or TradingView account.</span><span class="sp"></span><button class="pd-btn sm" data-act="tab" data-arg="built">How it is built</button><button class="pd-btn sm gold" data-act="tab" data-arg="offer">Prices and milestones</button></div>
<div class="pd-top">
  <div class="pd-brand"><span class="pd-logo">PD</span>Pattern Desk</div>
  <span class="pd-chip paper">PAPER</span>
  <span class="faint" id="datarange"></span>
  <span class="sp"></span>
  <button class="pd-btn sm" id="killbtn" data-act="kill">Kill switch: off</button>
</div>
<nav class="pd-tabs" id="tabs"></nav>
<main id="app"></main>
<div id="toast" class="pd-toast" hidden></div>

<script src="src/patterns.js"></script>
<script src="src/backtest.js"></script>
<script src="src/router.js"></script>
<script src="src/tvAlert.js"></script>
<script id="fallback" type="application/json">__FALLBACK__</script>
<script>
(function () {
  'use strict';
  var P = PatternEngine, B = Backtest, R = Router, T = TvAlert;
  var TESTS = '__TESTS__';
  var S, $app = document.getElementById('app');
  var TABS = [['lab', 'Strategy & chart'], ['backtest', 'Backtest (15 days)'], ['accounts', 'Accounts & orders'], ['tv', 'TradingView alerts'], ['built', 'How it is built'], ['offer', 'Prices']];
  var st = {
    tab: 'lab', symbol: 'SPY', mode: 'day', day: null, cfg: { day: P.defaultsFor('day'), swing: P.defaultsFor('swing') }, bt: { costPct: 0.03, slippageTicks: 1, symbols: null },
    accounts: null, router: { killSwitch: false, open: {}, dayLoss: {}, routed: {} }, sigSel: null, journal: [], secret: null, tvText: '', tvResult: null, tvSeen: {}, lastBt: null, focusTrade: null
  };
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function sym(s) { return S.symbols.filter(function (x) { return x.symbol === s; })[0]; }
  function ccy(m) { return m === 'NSE' ? '₹' : '$'; }
  function px(v, m) { return ccy(m) + Number(v).toFixed(2); }
  function rcls(v) { return v > 0 ? 'pos' : v < 0 ? 'neg' : 'muted'; }
  function fmtR(v) { return (v > 0 ? '+' : '') + Number(v).toFixed(2) + 'R'; }
  var toastT;
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 4200); }
  function cfg() { return st.cfg[st.mode]; }
  function prettyDay(d) { var m = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']; return (+d.slice(8, 10)) + ' ' + m[+d.slice(5, 7) - 1]; }
  function randSecret() { var a = new Uint8Array(18); (window.crypto || {}).getRandomValues ? window.crypto.getRandomValues(a) : a.forEach(function (_, i) { a[i] = Math.floor(Math.random() * 256); }); return Array.prototype.map.call(a, function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }

  async function boot() {
    try { if (location.protocol === 'file:') throw 0; var ctl = new AbortController(); var tm = setTimeout(function () { ctl.abort(); }, 4000); var r = await fetch('data/sample.json', { signal: ctl.signal }); clearTimeout(tm); if (!r.ok) throw 0; S = await r.json(); }
    catch (e) { S = JSON.parse(document.getElementById('fallback').textContent); }
    st.accounts = JSON.parse(JSON.stringify(S.accounts));
    st.day = S.days[S.days.length - 1];
    st.secret = randSecret();
    document.getElementById('datarange').textContent = S.days.length + ' synthetic sessions, ' + prettyDay(S.days[0]) + ' to ' + prettyDay(S.days[S.days.length - 1]) + ' 2026';
    var h = (location.hash || '').replace('#', '');
    if (TABS.some(function (t) { return t[0] === h; })) st.tab = h;
    pickDayWithSignal();
    render();
  }
  function pickDayWithSignal() {
    var r = B.runSymbol(S, sym(st.symbol), 'day', st.cfg.day, st.bt);
    if (r.trades.length) st.day = r.trades[r.trades.length - 1].entryDay;
  }

  var rendering = false, again = false;
  function render() {
    if (rendering) { again = true; return; }
    rendering = true;
    try { renderNow(); } finally { rendering = false; }
    if (again) { again = false; render(); }
  }
  function renderNow() {
    document.getElementById('tabs').innerHTML = TABS.map(function (t) { return '<button class="' + (st.tab === t[0] ? 'on' : '') + '" data-act="tab" data-arg="' + t[0] + '">' + t[1] + '</button>'; }).join('');
    var kb = document.getElementById('killbtn'); kb.textContent = 'Kill switch: ' + (st.router.killSwitch ? 'ON' : 'off'); kb.className = 'pd-btn sm' + (st.router.killSwitch ? ' on' : '');
    $app.innerHTML = ({ lab: viewLab, backtest: viewBacktest, accounts: viewAccounts, tv: viewTv, built: viewBuilt, offer: viewOffer })[st.tab]();
    after();
  }

  // ------------------------------------------------------------------ settings panel (shared by lab and backtest)
  function settings() {
    var c = cfg();
    var num = function (k, label, step, min) { return '<label class="pd-field">' + label + '<input type="number" data-cfg="' + k + '" value="' + esc(c[k]) + '" step="' + step + '"' + (min !== undefined ? ' min="' + min + '"' : '') + '></label>'; };
    return '<div class="pd-card"><h4 class="pd-h" style="margin-top:0">Strategy settings (' + (st.mode === 'day' ? 'day, 5-minute' : 'swing, 60-minute') + ')</h4>' +
      '<div class="pd-two">' + num('pivot', 'Pivot bars each side', 1, 1) + num('tolerancePct', 'Tops within %', 0.05, 0) + num('minGap', 'Min bars apart', 1, 2) + num('maxGap', 'Max bars apart', 1, 3) +
      num('minDepthPct', 'Neckline depth %', 0.05, 0) + num('maxBarsToBreak', 'Bars to break', 1, 1) + num('volumeMult', 'Breakout volume x', 0.1, 0) + num('minRR', 'Min reward : risk', 0.1, 0) + '</div>' +
      '<label class="pd-field">Stop<select data-cfg="stop"><option value="last_swing"' + (c.stop === 'last_swing' ? ' selected' : '') + '>Beyond the last swing (tighter)</option><option value="tops"' + (c.stop === 'tops' ? ' selected' : '') + '>Beyond the tops / bottoms</option><option value="mid"' + (c.stop === 'mid' ? ' selected' : '') + '>Halfway into the pattern</option></select></label>' +
      '<div class="pd-two"><label class="pd-field">Target<select data-cfg="target"><option value="measured"' + (c.target === 'measured' ? ' selected' : '') + '>Measured move</option><option value="r"' + (c.target === 'r' ? ' selected' : '') + '>Fixed R multiple</option></select></label>' +
      (c.target === 'r' ? num('targetR', 'Target (R)', 0.5, 0.5) : num('targetMult', 'Height x', 0.25, 0.25)) + '</div>' +
      '<label class="pd-field">Trade<select data-cfg="sides"><option value="both"' + (c.sides === 'both' ? ' selected' : '') + '>Tops and bottoms</option><option value="long"' + (c.sides === 'long' ? ' selected' : '') + '>Double bottoms only (long)</option><option value="short"' + (c.sides === 'short' ? ' selected' : '') + '>Double tops only (short)</option></select></label>' +
      '<button class="pd-btn sm" data-act="resetcfg">Reset to defaults</button></div>';
  }

  // ------------------------------------------------------------------ lab
  function viewLab() {
    var s = sym(st.symbol), mode = st.mode;
    var r = B.runSymbol(S, s, mode, cfg(), st.bt);
    var bars = r.bars, from = 0, to = bars.length;
    if (mode === 'day') { from = bars.findIndex(function (b) { return b.day === st.day; }); to = from; while (to < bars.length && bars[to].day === st.day) to++; }
    var pats = r.detection.patterns.filter(function (p) { return p.p2.i >= from && p.p2.i < to; });
    var trades = r.trades.filter(function (t) { var i = bars.findIndex(function (b) { return b.day === t.entryDay && b.time === t.entryTime; }); return i >= from && i < to; });
    var days = S.days.map(function (d) { var n = r.trades.filter(function (t) { return t.entryDay === d; }).length; return '<option value="' + d + '"' + (d === st.day ? ' selected' : '') + '>' + prettyDay(d) + (n ? ' (' + n + ' trade' + (n > 1 ? 's' : '') + ')' : '') + '</option>'; }).join('');
    var html = '<div class="pd-view"><h1>Double tops and double bottoms, found bar by bar</h1><p class="lead">This is a live tool, not a video. Change any setting and the patterns, signals and trades below are found again from the bars, the same way the server does it live: a swing high only counts once ' + cfg().pivot + ' bars have closed after it, so nothing here uses the future.</p>' +
      '<div class="pd-side"><div>' +
      '<div class="pd-card" style="margin-bottom:12px"><label class="pd-field">Symbol<select data-bind="symbol">' + S.symbols.map(function (x) { return '<option value="' + x.symbol + '"' + (x.symbol === st.symbol ? ' selected' : '') + '>' + x.symbol + ' · ' + x.market + ' · ' + esc(x.market === 'NSE' ? 'Zerodha, Angel One' : 'IBKR') + '</option>'; }).join('') + '</select></label>' +
      '<label class="pd-field">Style<select data-bind="mode"><option value="day"' + (mode === 'day' ? ' selected' : '') + '>Day trading (5-minute bars)</option><option value="swing"' + (mode === 'swing' ? ' selected' : '') + '>Swing trading (60-minute bars)</option></select></label>' +
      (mode === 'day' ? '<label class="pd-field">Session<select data-bind="day">' + days + '</select></label>' : '') +
      '<div class="faint" style="font-size:12px">Try to break it: set "Tops within %" to 0.05 (almost nothing qualifies), or the breakout volume to 3x (every break is skipped, with the reason), or switch the stop to "Beyond the tops" and watch reward:risk fall under 1.</div></div>' +
      settings() + '</div><div>' +
      chart(bars, from, to, pats, trades, s) +
      '<div class="pd-legend"><span><i style="background:var(--warn)"></i>tops / bottoms</span><span><i style="background:#9aa7b4"></i>neckline</span><span><i style="background:var(--short)"></i>stop</span><span><i style="background:var(--long)"></i>target</span><span>▲▼ entries</span></div>';
    html += '<h4 class="pd-h">Trades on this ' + (mode === 'day' ? 'session' : 'chart') + ' (' + trades.length + ')</h4>' + (trades.length ? tradeTable(trades) : '<p class="muted">No trades with these settings. Patterns that formed are listed below with the reason each one did not trade.</p>');
    html += '<h4 class="pd-h">Every pattern the engine saw (' + pats.length + ')</h4>' + (pats.length ? '<div class="pd-tbl-wrap"><table class="pd-tbl"><thead><tr><th>Pattern</th><th>Tops / bottoms</th><th>Neckline</th><th>Outcome</th></tr></thead><tbody>' +
      pats.map(function (p) { return '<tr><td>' + (p.type === 'double_top' ? 'Double top' : 'Double bottom') + '<div class="faint" style="font-size:12px">' + esc(bars[p.p1.i].time + ' and ' + bars[p.p2.i].time + (mode === 'swing' ? ' (' + prettyDay(bars[p.p1.i].day) + ', ' + prettyDay(bars[p.p2.i].day) + ')' : '')) + '</div></td><td class="mono">' + p.p1.price.toFixed(2) + ' / ' + p.p2.price.toFixed(2) + ' <span class="faint">(' + p.diffPct + '% apart)</span></td><td class="mono">' + p.neckline.toFixed(2) + '</td><td><span class="pd-chip ' + (p.status === 'triggered' ? 'ok' : p.status === 'skipped' ? 'warn' : 'grey') + '">' + p.status + '</span> <span class="muted">' + esc(p.note) + '</span></td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="muted">No patterns on this chart.</p>');
    return html + '</div></div></div>';
  }
  function tradeTable(trades, clickable) {
    return '<div class="pd-tbl-wrap"><table class="pd-tbl"><thead><tr><th>Entry</th><th>Symbol</th><th>Side</th><th class="r">Entry</th><th class="r">Stop</th><th class="r">Target</th><th class="r">Exit</th><th>Why it closed</th><th class="r">Result</th></tr></thead><tbody>' +
      trades.map(function (t) { return '<tr' + (clickable ? ' class="click" data-act="opentrade" data-arg="' + esc(t.id) + '"' : '') + '><td>' + prettyDay(t.entryDay) + ' ' + t.entryTime + '</td><td><b>' + t.symbol + '</b></td><td><span class="pd-chip ' + t.side + '">' + (t.side === 'long' ? 'Long' : 'Short') + '</span></td><td class="r mono">' + t.entry.toFixed(2) + '</td><td class="r mono">' + t.stop.toFixed(2) + '</td><td class="r mono">' + t.target.toFixed(2) + '</td><td class="r mono">' + t.exit.toFixed(2) + '</td><td class="muted">' + esc(t.exitReason) + (t.exitDay !== t.entryDay ? ' (' + prettyDay(t.exitDay) + ')' : '') + '</td><td class="r ' + rcls(t.r) + '">' + fmtR(t.r) + '</td></tr>'; }).join('') + '</tbody></table></div>';
  }
  function chart(bars, from, to, pats, trades, s) {
    var view = bars.slice(from, to), n = view.length, bw = n > 90 ? 8 : 11, w = n * bw + 70, h = 330, pad = 16;
    var hi = Math.max.apply(null, view.map(function (b) { return b.h; })), lo = Math.min.apply(null, view.map(function (b) { return b.l; }));
    trades.forEach(function (t) { hi = Math.max(hi, t.stop, t.target); lo = Math.min(lo, t.stop, t.target); });
    var span = hi - lo || 1; hi += span * 0.04; lo -= span * 0.04;

  // ------------------------------------------------------------------ events
  function after() {
    var ta = document.getElementById('tvtext');
    if (ta) ta.addEventListener('input', function () { st.tvText = ta.value; });
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), arg = el.getAttribute('data-arg');
    if (act === 'tab') { st.tab = arg; render(); window.scrollTo(0, 0); }
    else if (act === 'kill') { st.router.killSwitch = !st.router.killSwitch; st.journal.push({ at: new Date().toISOString().slice(11, 19), text: 'Kill switch ' + (st.router.killSwitch ? 'ON: no new orders on any account' : 'off') }); render(); toast(st.router.killSwitch ? 'Kill switch on: every account refuses new orders' : 'Kill switch off'); }
    else if (act === 'resetcfg') { st.cfg[st.mode] = P.defaultsFor(st.mode); render(); }
    else if (act === 'opentrade') { var t = (st.lastBt.trades || []).filter(function (x) { return x.id === arg; })[0]; if (t) { st.symbol = t.symbol; st.day = t.entryDay; st.tab = 'lab'; render(); window.scrollTo(0, 0); } }
    else if (act === 'sendpaper') {
      var ld = st.lastDecisions; if (!ld) return;
      var takers = ld.dec.filter(function (d) { return d.take; });
      R.record(st.router, ld.dec, ld.sig);
      st.journal.push({ at: new Date().toISOString().slice(11, 19), text: ld.sig.symbol + ' ' + ld.sig.side + ': ' + (takers.length ? takers.map(function (d) { return d.label.split(' (')[0] + ' ' + d.size.qty; }).join(', ') : 'no account took it') + ' (paper: ' + takers.reduce(function (n, d) { return n + d.orders.length; }, 0) + ' requests logged, none sent)' });
      toast(takers.length ? 'Logged ' + takers.length + ' account' + (takers.length > 1 ? 's' : '') + ' in paper. Send again and it is refused.' : 'No account took it: see the reasons.');
      render();
    }
    else if (act === 'resetpaper') { st.router = { killSwitch: false, open: {}, dayLoss: {}, routed: {} }; st.journal = []; render(); }
    else if (act === 'copypine') { var txt = document.getElementById('pine').textContent; if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { toast('Pine Script copied'); }, function () { toast('Select the code and copy it'); }); }
    else if (act === 'tvsend') { st.tvText = document.getElementById('tvtext').value; st.tvResult = T.parse(st.tvText, { secret: st.secret, symbols: S.symbols, cfg: st.cfg[(function () { try { return JSON.parse(st.tvText).mode === 'swing' ? 'swing' : 'day'; } catch (x) { return 'day'; } })()], seen: st.tvSeen }); if (st.tvResult.ok) st.sigSel = st.tvResult.signal.id; render(); }
    else if (act === 'tvbreak') {
      try { var j = JSON.parse(document.getElementById('tvtext').value); if (arg === 'secret') j.secret = 'not-the-secret'; if (arg === 'symbol') { j.symbol = 'TSLA'; j.id = 'x-' + Date.now(); } if (arg === 'levels') { j.close = j.extreme * (j.side === 'short' ? 1.01 : 0.99); j.id = 'y-' + Date.now(); } st.tvText = JSON.stringify(j, null, 2); } catch (x) { }
      render();
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, b = el.getAttribute('data-bind'), c = el.getAttribute('data-cfg'), bt = el.getAttribute('data-bt'), ac = el.getAttribute('data-acc');
    if (b === 'symbol') { st.symbol = el.value; pickDayWithSignal(); render(); }
    else if (b === 'mode') { st.mode = el.value; render(); }

    else if (b === 'tvpick') { var sg = allSignals().filter(function (x) { return x.id === el.value; })[0]; if (sg) { st.tvText = T.examplePayload(sg, st.secret, sym(sg.symbol)); st.tvResult = null; render(); } }
    else if (c) { var v = el.tagName === 'SELECT' ? el.value : Number(el.value); if (el.tagName !== 'SELECT' && (!isFinite(v) || v < 0)) { toast('That setting needs a number of 0 or more'); render(); return; } st.cfg[st.mode][c] = v; render(); }
    else if (bt) { var n = Number(el.value); if (!isFinite(n) || n < 0) { toast('Costs and slippage must be 0 or more'); render(); return; } st.bt[bt] = n; render(); }
    else if (ac) { var a = st.accounts[+el.getAttribute('data-i')]; if (el.type === 'checkbox') a[ac] = el.checked; else { var nv = Number(el.value); if (!isFinite(nv) || nv < 0) { toast('Use a number of 0 or more'); render(); return; } a[ac] = nv; } render(); }
